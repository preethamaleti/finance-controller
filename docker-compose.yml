version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finctrl_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./finctrl.db
      - LLM_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - HITL_AUTO_THRESHOLD=10000
      - HITL_RECOMMEND_THRESHOLD=100000
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finctrl_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
